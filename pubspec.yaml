name: skillbridg
description: AI Powered Career Development Platform
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # -----------------------------
  # STATE MANAGEMENT
  # -----------------------------
  flutter_riverpod: ^3.0.3

  # -----------------------------
  # ROUTING
  # -----------------------------
  go_router: ^16.2.1

  # -----------------------------
  # FIREBASE
  # -----------------------------
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  firebase_messaging: ^16.0.1

  # -----------------------------
  # NETWORK
  # -----------------------------
  dio: ^5.9.0
  connectivity_plus: ^7.0.0

  # -----------------------------
  # LOCAL STORAGE
  # -----------------------------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # -----------------------------
  # IMAGE
  # -----------------------------
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0
  flutter_svg: ^2.2.0

  # -----------------------------
  # UI
  # -----------------------------
  google_fonts: ^6.3.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.3

  # -----------------------------
  # UTILITIES
  # -----------------------------
  intl: ^0.20.2
  equatable: ^2.0.7
  uuid: ^4.5.1
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0
  device_info_plus: ^12.2.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.1

  # -----------------------------
  # JSON
  # -----------------------------
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.7.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/lottie/